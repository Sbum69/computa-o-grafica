<!DOCTYPE html>
<html lang="pt">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Chuva Residual</title>
	<style>
		body {
			margin: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			background: #111;
			background-color: #e0f7fa;
		}

		#startImage {
			cursor: pointer;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
			width: 600px;
			height: 400px;
			transform: scale(2);
			transform-origin: center center;
			border: 3px solid #2e7d32;
		}
	</style>
</head>
<body>

	<img id="startImage" src="../titlescreen.png" alt="Clique para começar o jogo">

	<script>
		document.getElementById("startImage").addEventListener("click", () => {
			window.location.href = "projeto.html";
		});
	</script>

</body>
</html>
